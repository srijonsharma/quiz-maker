{% extends 'base.html' %}

{% block title %}Login - MicroBio Quiz{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px;">
    <h2 style="margin-bottom: 2rem; text-align: center; color: var(--secondary);">Login to Your Account</h2>
    <form method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your registered email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem; border-radius: 12px; font-size: 1.1rem;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
        Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary); font-weight: 600;">Sign Up</a>
    </p>
</div>
{% endblock %}
