{% extends 'base.html' %}

{% block title %}Create Question - QuizForge{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <h2 style="margin-bottom: 2rem; color: var(--secondary); text-align: center;">Contribute a New Question</h2>
    <form method="POST">
        <div class="form-group">
            <label for="question_text">Question Text</label>
            <textarea id="question_text" name="question_text" class="form-control" rows="3" required placeholder="Enter your question here..."></textarea>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label for="option_a">Option A</label>
                <input type="text" id="option_a" name="option_a" class="form-control" required placeholder="First choice">
            </div>
            <div class="form-group">
                <label for="option_b">Option B</label>
                <input type="text" id="option_b" name="option_b" class="form-control" required placeholder="Second choice">
            </div>
            <div class="form-group">
                <label for="option_c">Option C</label>
                <input type="text" id="option_c" name="option_c" class="form-control" required placeholder="Third choice">
            </div>
            <div class="form-group">
                <label for="option_d">Option D</label>
                <input type="text" id="option_d" name="option_d" class="form-control" required placeholder="Fourth choice">
            </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
            <label for="correct_option">Correct Answer</label>
            <select id="correct_option" name="correct_option" class="form-control" required>
                <option value="" disabled selected>Select the correct option</option>
                <option value="A">Option A</option>
                <option value="B">Option B</option>
                <option value="C">Option C</option>
                <option value="D">Option D</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 2rem; border-radius: 12px;">Add Question to Database</button>
    </form>
</div>
{% endblock %}
