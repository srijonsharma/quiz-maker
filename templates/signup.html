{% extends 'base.html' %}

{% block title %}Sign Up - MicroBio Quiz{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px;">
    <h2 style="margin-bottom: 2rem; text-align: center; color: var(--secondary);">Create Your Account</h2>
    <form method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" class="form-control" required placeholder="Enter mobile number">
            </div>
            <div class="form-group">
                <label for="institution">Institution</label>
                <input type="text" id="institution" name="institution" class="form-control" required placeholder="College or University name">
            </div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Create a strong password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem; border-radius: 12px; font-size: 1.1rem;">Create Account</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Login here</a>
    </p>
</div>
{% endblock %}
